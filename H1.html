<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: #f8f9fa; color: #333; }
    .container { display: flex; flex-wrap: wrap; gap: 15px; }
    .viewer-box { flex: 2; min-width: 300px; }
    iframe { width: 100%; height: 500px; border: none; border-radius: 8px; background-color: #e9ecef; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .sidebar { flex: 1; min-width: 260px; max-height: 500px; overflow-y: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h3 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .lag-raekke { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .lag-navn { font-weight: 500; padding-right: 10px; word-break: break-word; }
    .knapper { display: flex; gap: 4px; flex-shrink: 0; }
    button { padding: 4px 8px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 11px; font-weight: bold; }
    .Skjul { background-color: #28a745; }
    .Vis { background-color: #007bff; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div class="container">
  <div class="viewer-box">
    <iframe id="api-frame" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
  </div>

  <div class="sidebar">
    <h3>Bygningsdele / Lag</h3>
    <div id="navTree">Starter 3D-visning...</div>
  </div>
</div>

<script>
var uid = "a7ad25ee7cf64da094be4fb88a0e8bd8"; 

window.onload = function() {
    var navTree = document.getElementById("navTree");
    var iframe = document.getElementById("api-frame");
    var client = new window.Sketchfab("1.12.1", iframe);

    client.init(uid, {
        autostart: 1,
        preload: 1,
        success: function(api) {
            navTree.innerHTML = "Forbundet – venter på 3D-model...";
            api.start();
            api.addEventListener("viewerready", function() {
                navTree.innerHTML = "Henter bygningsdele...";
                
                api.getSceneGraph(function(err, result) {
                    if (err) {
                        navTree.innerHTML = "Fejl ved hentning af lag.";
                        return;
                    }
                    
                    navTree.innerHTML = "";
                    var fundet = 0;

                    function findLag(node) {
                        if (!node) return;
                        
                        // Vis alle grupper og dele der har et rigtigt navn
                        var ignorer = ["RootNode", "root", "Scene", "GLTF", "SketchUp", "Model"];
                        var erGyldig = node.name && 
                                       ignorer.indexOf(node.name) === -1 && 
                                       !node.name.startsWith("Mesh") && 
                                       !node.name.startsWith("Geometry") &&
                                       (node.type === "MatrixTransform" || node.type === "Group");

                        if (erGyldig) {
                            fundet++;
                            var raekke = document.createElement("div");
                            raekke.className = "lag-raekke";

                            var navn = document.createElement("span");
                            navn.className = "lag-navn";
                            navn.innerText = node.name.replace(/_/g, " ");

                            var knapBoks = document.createElement("div");
                            knapBoks.className = "knapper";

                            var hideBtn = document.createElement("button");
                            hideBtn.className = "Skjul";
                            hideBtn.innerText = "Skjul";
                            hideBtn.onclick = function() {
                                api.hide(node.instanceID);
                                hideBtn.style.backgroundColor = "#dc3545";
                            };

                            var showBtn = document.createElement("button");
                            showBtn.className = "Vis";
                            showBtn.innerText = "Vis";
                            showBtn.onclick = function() {
                                api.show(node.instanceID);
                                hideBtn.style.backgroundColor = "#28a745";
                            };

                            knapBoks.appendChild(hideBtn);
                            knapBoks.appendChild(showBtn);
                            raekke.appendChild(navn);
                            raekke.appendChild(knapBoks);
                            navTree.appendChild(raekke);
                        }

                        if (node.children && node.children.length > 0) {
                            for (var i = 0; i < node.children.length; i++) {
                                findLag(node.children[i]);
                            }
                        }
                    }

                    findLag(result);

                    if (fundet === 0) {
                        navTree.innerHTML = "Ingen navngivne grupper fundet i modellen.";
                    }
                });
            });
        },
        error: function() {
            navTree.innerHTML = "Kunne ikke indlæse modellen.";
        }
    });
};
</script>

</body>
</html>
