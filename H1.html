<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f8; color: #333; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; }
    .viewer-box { flex: 2; min-width: 320px; }
    iframe { width: 100%; height: 550px; border: none; border-radius: 8px; background-color: #e9ecef; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .sidebar { flex: 1; min-width: 300px; max-height: 550px; overflow-y: auto; background: transparent; }
    
    /* Hovedgrupper (VINDUE, KONSTRUKTION osv.) */
    .hoved-gruppe { background: #e9ecef; border-radius: 6px; margin-bottom: 10px; border: 1px solid #d1d5db; overflow: hidden; }
    .hoved-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; font-weight: bold; font-size: 14px; cursor: pointer; user-select: none; }
    .hoved-header:hover { background: #dfe3e8; }
    .pil { display: inline-block; margin-right: 8px; transition: transform 0.2s; font-size: 12px; }
    .pil.aaben { transform: rotate(90deg); }
    
    /* Undergrupper (foldes ud) */
    .under-liste { display: none; background: #ffffff; padding: 5px 15px 10px 25px; border-top: 1px solid #d1d5db; }
    .under-liste.aaben { display: block; }
    .under-raekke { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .under-raekke:last-child { border-bottom: none; }
    
    /* Knapper */
    .knapper { display: flex; gap: 6px; flex-shrink: 0; }
    button { padding: 6px 14px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 12px; font-weight: bold; }
    .under-raekke button { padding: 4px 10px; font-size: 11px; }
    .Vis { background-color: #007bff; }
    .Skjul { background-color: #28a745; }
    .Skjul.skjult-aktiv { background-color: #dc3545; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>

<div class="container">
  <div class="viewer-box">
    <iframe id="api-frame" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
  </div>

  <div class="sidebar">
    <div id="navTree">Indlæser bygningsdele...</div>
  </div>
</div>

<script>
var uid = "a7ad25ee7cf64da094be4fb88a0e8bd8"; 

window.onload = function() {
    var navTree = document.getElementById("navTree");
    var iframe = document.getElementById("api-frame");
    var client = new window.Sketchfab("1.12.1", iframe);

    client.init(uid, {
        autostart: 1,
        preload: 1,
        success: function(api) {
            api.start();
            api.addEventListener("viewerready", function() {
                api.getSceneGraph(function(err, result) {
                    if (err) {
                        navTree.innerHTML = "Fejl ved hentning af lag.";
                        return;
                    }
                    
                    navTree.innerHTML = "";
                    var ignorer = ["RootNode", "root", "Scene", "GLTF", "SketchUp", "Model"];

                    // Find selve hovedmappen (springer .fbx-filnavnet over)
                    function findHovedGrupper(node) {
                        var liste = [];
                        var maal = ["VINDUE", "KONSTRUKTION", "UDVENDIGT", "INDVENDIGT"];
                        
                        function sog(n) {
                            if (!n) return;
                            var rent = n.name ? n.name.replace(/_/g, " ").trim().toUpperCase() : "";
                            if (maal.indexOf(rent) !== -1 && (n.type === "MatrixTransform" || n.type === "Group")) {
                                liste.push(n);
                                return;
                            }
                            if (n.children) {
                                for (var i = 0; i < n.children.length; i++) {
                                    sog(n.children[i]);
                                }
                            }
                        }
                        sog(node);
                        
                        if (liste.length === 0 && node && node.children) {
                            function findFoersteLag(n) {
                                if (!n || !n.children) return [];
                                var res = [];
                                for (var i = 0; i < n.children.length; i++) {
                                    var b = n.children[i];
                                    var skip = !b.name || ignorer.indexOf(b.name) !== -1 || b.name.toLowerCase().endsWith(".fbx") || b.name.startsWith("Mesh") || b.name.startsWith("Geometry");
                                    if (!skip && (b.type === "MatrixTransform" || b.type === "Group")) {
                                        res.push(b);
                                    } else if (b.children) {
                                        res = res.concat(findFoersteLag(b));
                                    }
                                }
                                return res;
                            }
                            return findFoersteLag(node);
                        }
                        return liste;
                    }

                    // Hent unikke underdele uden dubletter
                    function findUnderDele(node) {
                        var liste = [];
                        var seteNavne = {};
                        
                        function gennemsog(n) {
                            if (!n || !n.children) return;
                            for (var i = 0; i < n.children.length; i++) {
                                var b = n.children[i];
                                if (b.name && !b.name.startsWith("Mesh") && !b.name.startsWith("Geometry") && (b.type === "MatrixTransform" || b.type === "Group")) {
                                    var rentNavn = b.name.replace(/_/g, " ").trim();
                                    if (!seteNavne[rentNavn]) {
                                        seteNavne[rentNavn] = { navn: rentNavn, ids: [] };
                                        liste.push(seteNavn[rentNavn]);
                                    }
                                    seteNavne[rentNavn].ids.push(b.instanceID);
                                } else {
                                    gennemsog(b);
                                }
                            }
                        }
                        gennemsog(node);
                        return liste;
                    }

                    var hovedGrupper = findHovedGrupper(result);

                    hovedGrupper.forEach(function(gruppe) {
                        var boks = document.createElement("div");
                        boks.className = "hoved-gruppe";

                        var header = document.createElement("div");
                        header.className = "hoved-header";

                        var titel = document.createElement("span");
                        var pil = document.createElement("span");
                        pil.className = "pil";
                        pil.innerHTML = "&#9654;"; // Pil til højre
                        titel.appendChild(pil);
                        titel.appendChild(document.createTextNode(gruppe.name.replace(/_/g, " ").toUpperCase()));

                        var knapBoks = document.createElement("div");
                        knapBoks.className = "knapper";

                        var visBtn = document.createElement("button");
                        visBtn.className = "Vis";
                        visBtn.innerText = "Vis";

                        var skjulBtn = document.createElement("button");
                        skjulBtn.className = "Skjul";
                        skjulBtn.innerText = "Skjul";

                        knapBoks.appendChild(visBtn);
                        knapBoks.appendChild(skjulBtn);
                        header.appendChild(titel);
                        header.appendChild(knapBoks);
                        boks.appendChild(header);

                        // Underliste
                        var underListe = document.createElement("div");
                        underListe.className = "under-liste";
                        var underDele = findUnderDele(gruppe);
                        var alleUnderSkjulKnapper = [];

                        underDele.forEach(function(del) {
                            var raekke = document.createElement("div");
                            raekke.className = "under-raekke";

                            var delNavn = document.createElement("span");
                            delNavn.innerText = del.navn;

                            var uKnapper = document.createElement("div");
                            uKnapper.className = "knapper";

                            var uVis = document.createElement("button");
                            uVis.className = "Vis";
                            uVis.innerText = "Vis";

                            var uSkjul = document.createElement("button");
                            uSkjul.className = "Skjul";
                            uSkjul.innerText = "Skjul";
                            alleUnderSkjulKnapper.push(uSkjul);

                            uSkjul.onclick = function(e) {
                                e.stopPropagation();
                                del.ids.forEach(function(id) { api.hide(id); });
                                uSkjul.classList.add("skjult-aktiv");
                            };

                            uVis.onclick = function(e) {
                                e.stopPropagation();
                                del.ids.forEach(function(id) { api.show(id); });
                                uSkjul.classList.remove("skjult-aktiv");
                            };

                            uKnapper.appendChild(uVis);
                            uKnapper.appendChild(uSkjul);
                            raekke.appendChild(delNavn);
                            raekke.appendChild(uKnapper);
                            underListe.appendChild(raekke);
                        });

                        // Klik på hoved-knapperne Vis / Skjul
                        skjulBtn.onclick = function(e) {
                            e.stopPropagation();
                            api.hide(gruppe.instanceID);
                            skjulBtn.classList.add("skjult-aktiv");
                            alleUnderSkjulKnapper.forEach(function(k) { k.classList.add("skjult-aktiv"); });
                        };

                        visBtn.onclick = function(e) {
                            e.stopPropagation();
                            api.show(gruppe.instanceID);
                            skjulBtn.classList.remove("skjult-aktiv");
                            alleUnderSkjulKnapper.forEach(function(k) { k.classList.remove("skjult-aktiv"); });
                        };
                        header.onclick = function() {
                            if (underDele.length > 0) {
                                underListe.classList.toggle("aaben");
                                pil.classList.toggle("aaben");
                            }
                        };

                        if (underDele.length > 0) {
                            boks.appendChild(underListe);
                        }
                        navTree.appendChild(boks);
                    });
                });
            });
        }
    });
};
</script>

</body>
</html>
